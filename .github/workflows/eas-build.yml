name: EAS Build - Matriz Contable CR

on:
  # Solo manual: el plan gratis de Expo da pocos builds al mes y cada push a main gastaba uno.
  # Para compilar: pestaña Actions → "EAS Build" → Run workflow.
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plataforma a compilar'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: 'Perfil de build (eas.json)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

concurrency:
  group: eas-build
  cancel-in-progress: true

jobs:
  build:
    name: Build con EAS
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: Autenticarse en Expo
        run: eas whoami || echo "EXPO_TOKEN no configurado o inválido. Revisa los secrets del repo."
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependencias del proyecto
        run: npm install

      - name: Enlazar el proyecto en EAS (dueño actual de app.json)
        # NO QUITAR ESTE PASO: confirma el proyecto (kenn-32 de k24101542cs-team)
        # antes de compilar, sin pedir nada a mano. Si falta, eas-cli en modo
        # no-interactivo a veces falla con "EAS project not configured".
        # EXPO_TOKEN debe ser un token de la cuenta que es miembro de k24101542cs-team.
        run: eas init --non-interactive --force
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Compilar (disparo manual con plataforma/perfil elegidos)
        run: eas build --platform ${{ github.event.inputs.platform }} --profile ${{ github.event.inputs.profile }} --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
