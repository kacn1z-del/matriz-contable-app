name: EAS Build - Matriz Contable CR

on:
  # Solo manual: el plan gratis de Expo da pocos builds al mes y cada push a main gastaba uno.
  # Para compilar: pestaña Actions → "EAS Build" → Run workflow.
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plataforma a compilar'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: 'Perfil de build (eas.json)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

concurrency:
  group: eas-build
  cancel-in-progress: true

jobs:
  build:
    name: Build con EAS
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: Autenticarse en Expo
        run: eas whoami || echo "EXPO_TOKEN no configurado o inválido. Revisa los secrets del repo."
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependencias del proyecto
        run: npm install

      - name: Enlazar/crear el proyecto en EAS (dueño actual de app.json)
        # NO QUITAR ESTE PASO: aunque app.json ya trae el projectId
        # escrito a mano, eas-cli en modo no-interactivo a veces no logra
        # verificarlo solo contra la cuenta de la organización
        # (keny2410s-organization) y el build falla con "EAS project not
        # configured" aunque el archivo esté bien. Este paso lo confirma
        # explícitamente antes de compilar, sin pedir nada a mano.
        # EXPO_TOKEN debe pertenecer a un miembro de keny2410s-organization.
        run: eas init --non-interactive --force
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Compilar (disparo manual con plataforma/perfil elegidos)
        run: eas build --platform ${{ github.event.inputs.platform }} --profile ${{ github.event.inputs.profile }} --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
